<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MusicStore</title>

    <link rel="stylesheet" href="/css/ventana2.css">

</head>

<body>



    <header>

        <h1>🎵 MusicStore</h1>

        <p>
            La mejor tienda musical online
        </p>

    </header>


    <section class="hero">

        <div class="contenido">

            <h2>
                Vive la Música al Máximo
            </h2>

            <p>
                Compra productos musicales premium
                con envíos rápidos y pagos seguros.
            </p>

            <button>
                Comprar Ahora
            </button>

        </div>

    </section>




    <section class="formulario">

        <h2>
            📦 Finalizar Pedido
        </h2>

        <div class="precio">

            <h3>
                Total: $1.550.000
            </h3>

        </div>

        <form>

            <input type="text"
            placeholder="Nombre Completo"
            required>

            <input type="text"
            placeholder="Ciudad"
            required>

            <input type="text"
            placeholder="Municipio"
            required>

            <input type="text"
            placeholder="Dirección"
            required>

            <input type="number"
            placeholder="Teléfono"
            required>

            <select required>

                <option value="">
                    Método de Pago
                </option>

                <option>
                    Nequi
                </option>

                <option>
                    Daviplata
                </option>

                <option>
                    Tarjeta
                </option>

            </select>

            <button type="submit"
            class="btn">

                Confirmar Compra

            </button>

        </form>

    </section>




    <footer>

        <p>
            © 2026 MusicStore
        </p>

    </footer>

</body>
</html>
